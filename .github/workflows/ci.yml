name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - run: go vet ./...

      # รวม integration test ที่ใช้ testcontainers (runner ของ GitHub มี Docker ให้อยู่แล้ว)
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run lint

      # สร้าง type ของ route (เช่น LayoutProps) ก่อน เพราะปกติ next dev/build เป็นคนสร้างให้
      - run: npx next typegen

      - run: npx tsc --noEmit

      - run: npm run build
